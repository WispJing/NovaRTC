spring:
  application:
    name: NovaRTC-Flyway
  datasource:
    url: jdbc:mysql://localhost:3307/novartc?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    encoding: UTF-8
    baseline-on-migrate: false
    locations: >
      classpath:db/migration,
      classpath:db/migration-dev
    table: flyway_schema_history
    validate-on-migrate: true

logging:
  level:
    root: INFO
    org.flywaydb: INFO
