syntax = "proto3";

package io.github.xiaotang.novartc.server.proto;

option java_multiple_files = false;
option java_package = "io.github.xiaotang.novartc.server.proto";
option java_outer_classname = "ChatMessage";

option csharp_namespace = "NovaRTC.Protocol";

enum MessageType {
  TEXT = 0;
  IMAGE = 1;
  VIDEO = 2;
  AUDIO = 3;
  FILE = 4;
  TEXT_AND_IMAGE = 5;
  SYSTEM = 6;
  PING = 7;
  PONG = 8;
  AUTH = 9;
  PRESENCE = 10;
  FRIEND_REQUEST = 11;
}

enum PresenceStatus {
  ONLINE = 0;
  OFFLINE = 1;
  BUSY = 2;
  AWAY = 3;
  INVISIBLE = 4;
}

enum FriendRequestStatus {
  FRIEND_REQUEST_PENDING = 0;
  FRIEND_REQUEST_ACCEPTED = 1;
  FRIEND_REQUEST_REJECTED = 2;
  FRIEND_REQUEST_CANCELED = 3;
}

enum FriendRequestEventType {
  FRIEND_REQUEST_CREATED = 0;
  FRIEND_REQUEST_UPDATED = 1;
}

message User {
  string user_id = 1;
  string username = 2;
  string avatar_url = 3;
}

message ImageContent {
  string image_url = 1;
  string image_description = 2;
}

message TextContent {
  string text = 1;
}

message TextAndImageContent {
  TextContent text_content = 1;
  ImageContent image_content = 2;
}

message Presence {
  string user_id = 1;
  PresenceStatus status = 2;
  int64 last_active_at = 3;
  string client_type = 4;
  string device_id = 5;
  bool is_broadcast = 6;
  string message = 7;
}

message FriendRequestEvent {
  string request_id = 1;
  string requester_id = 2;
  string receiver_id = 3;
  FriendRequestStatus status = 4;
  string request_msg = 5;
  int64 created_at = 6;
  int64 handled_at = 7;
  string handler_id = 8;
  FriendRequestEventType event_type = 9;
  bool unread = 10;
}

message MsgBody {
  string message_id = 1;
  MessageType message_type = 2;
  User sender = 3;
  int64 timestamp = 4;
  bool is_group = 5;

  SingleChatInfo single_chat_info = 6;
  GroupChatInfo group_chat_info = 7;

  oneof content {
    TextContent text_content = 8;
    ImageContent image_content = 9;
    TextAndImageContent text_and_image_content = 10;
    Ping pong_ping = 11;
    Pong pong_response = 12;
    Auth auth_message = 13;
    Presence presence_message = 14;
    FriendRequestEvent friend_request_event = 15;
  }
}

message GroupChatInfo {
  string chat_id = 1;
  string group_id = 2;
}

message SingleChatInfo {
  string chat_id = 1;
  string user1_id = 2;
  string user2_id = 3;
}

message Ping {
  string ping_id = 1;
  string message = 2;
}

message Pong {
  string ping_id = 1;
  string message = 2;
}

message Auth {
  string user_id = 1;
  string token = 2;
  bool success = 3;
  string message = 4;
}

message ReadStatus {
  string message_id = 1;
  string user_id = 2;
  string read_at = 3;
}
