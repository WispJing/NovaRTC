server:
  port: 7000
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  application:
    name: NovaRTC
  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX
  data:
    mongodb:
      uri: mongodb://127.0.0.1:27017/novartc

logging:
  level:
    root: INFO
    io.github.xiaotang: INFO
    io.netty: INFO
    org.mongodb.driver: WARN
    org.springframework: INFO
