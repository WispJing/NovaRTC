server:
  port: 7000
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  application:
    name: NovaRTC
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX
    serialization:
      write-dates-as-timestamps: false
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: localhost
      database: 0
      port: 6379
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 2000ms
    mongodb:
      uri: mongodb://localhost:27017/novartc
  datasource:
    url: jdbc:mysql://localhost:3307/novartc?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Druid 连接池配置
    druid:
      # 初始连接数（默认0）
      initial-size: 5
      # 最小空闲连接数（默认0）
      min-idle: 10
      # 最大活动连接数（默认8）
      max-active: 50
      # 获取连接的超时时间（毫秒）
      max-wait: 60000
      # 间隔多久检测一次空闲连接（毫秒）
      time-between-eviction-runs-millis: 60000
      # 连接在池中最小生存时间（毫秒）
      min-evictable-idle-time-millis: 300000
      # 连接在池中最大生存时间（毫秒，需小于MySQL wait_timeout）
      max-evictable-idle-time-millis: 580000
      # 测试连接是否有效的SQL
      validation-query: SELECT 1
      # 申请连接时是否检测（建议false，true会降低性能）
      test-on-borrow: false
      # 归还连接时是否检测（建议false）
      test-on-return: false
      # 建议保持为true，空闲时检测连接有效性 [citation:6]
      test-while-idle: true
      # 是否缓存PreparedStatement（开启可提升性能，但耗内存）
      pool-prepared-statements: false
      # 启用keepAlive，防止空闲连接被MySQL主动断开 [citation:6]
      keep-alive: true
      # 监控配置（通过Web页面查看）
      stat-view-servlet:
        # 启用监控页面
        enabled: true
        # 访问路径：http://ip:port/druid
        url-pattern: /druid/*
        # 监控页面登录用户名
        login-username: admin
        # 监控页面登录密码
        login-password: admin123
        # 允许清空统计数据
        reset-enable: false
      # Web应用关联的过滤器（用于统计URI请求）
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      # 防火墙和日志过滤器
      filter:
        stat:
          enabled: true
          # 慢SQL记录（毫秒）
          slow-sql-millis: 2000
          log-slow-sql: true
        wall:
          enabled: true
          # SQL防火墙配置（防止SQL注入）
          config:
            delete-allow: true
            update-allow: true
        slf4j:
          enabled: true
          # 日志输出SQL执行信息
          statement-executable-sql-log-enable: true
  sql:
    init:
      mode: never
  flyway:
    enabled: false
    encoding: UTF-8
    baseline-on-migrate: false
    locations: >
      classpath:db/migration,
      classpath:db/migration-dev
    table: flyway_schema_history
    validate-on-migrate: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

rocketmq:
  enabled: true
  name-server: localhost:9876
  producer:
    group: im-chat-producer-group

im:
  host: localhost
  port: 9688
  # 单实例最大 IM 连接数，0 表示不限制
  maxConnections: 0
  chatTopic: 'im-chat-topic'
  chatConsumerGroup: 'im-chat-consumer-group'
  presenceTopic: 'im-presence-topic'
  presenceConsumerGroup: 'im-presence-consumer-group'
  tokenKickTopic: 'im-token-kick-topic'
  tokenKickConsumerGroup: 'im-token-kick-consumer-group'
  userInstancesKeyPreFix: 'im:user:instances:'
  instanceKeyPreFix: 'im:user:instance:'
  chatSeqKeyPreFix: 'im:chatseq:'
  userFriendCacheKeyPreFix: 'im:relation:user:friends:'
  userGroupCacheKeyPreFix: 'im:relation:user:groups:'
  groupMembersCacheKeyPreFix: 'im:relation:group:members:'

minio:
  endpoint: http://localhost:6000
  access-key: novartc
  secret-key: novartc123456
  bucket: novartc
  url-prefix:
  max-file-size: 20
  allowed-extensions: jpg,jpeg,png,gif,webp,bmp,mp4,mp3,wav,pdf,doc,docx,xls,xlsx,zip

file-cleanup:
  grace-period-hours: 24
  batch-size: 200
  lock-key: novartc:lock:invalid-file-record-cleanup
  lock-lease-minutes: 30

job:
  topic: 'novartc-job-topic'
  resultTopic: 'novartc-job-result-topic'
  consumerGroup: 'novartc-job-consumer-group'
  allowedPackagePrefix: 'io.github.xiaotang.novartc'

logging:
  level:
    root: INFO
    io.github.xiaotang: INFO
    io.github.xiaotang.novartc.server.mapper: DEBUG
    com.baomidou.mybatisplus: DEBUG
    org.apache.ibatis: DEBUG
    io.netty: INFO

