server:
  port: 7000
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  application:
    name: NovaRTC
  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX
    serialization:
      write-dates-as-timestamps: false
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: localhost
      database: 0
      port: 6379
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 2000ms
    mongodb:
      uri: mongodb://localhost:27017/novartc

rocketmq:
  enabled: true
  name-server: localhost:9876
  producer:
    group: im-producer-group

im:
  host: localhost
  port: 9688
  imMsgTopic: 'IM_MSG_TOPIC'
  userInstancesKeyPreFix: 'im:user:instances:'
  instanceKeyPreFix: 'im:user:instance:'
  chatSeqKeyPreFix: 'im:chatseq:'

logging:
  level:
    root: INFO
    io.github.xiaotang: INFO
    io.netty: INFO
    org.mongodb.driver: WARN
    org.springframework: INFO
