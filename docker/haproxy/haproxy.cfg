global
  log stdout format raw local0
  maxconn 4096

defaults
  log global
  timeout connect 5s
  timeout client 120s
  timeout server 120s

resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 5s

frontend novartc_http_front
  bind *:7000
  mode http
  default_backend novartc_http_back

backend novartc_http_back
  mode http
  balance roundrobin
  option tcp-check
  server-template srv 10 novartc-server:7000 check resolvers docker init-addr libc,none resolve-prefer ipv4

frontend novartc_im_front
  bind *:9688
  mode tcp
  default_backend novartc_im_back

backend novartc_im_back
  mode tcp
  balance leastconn
  timeout tunnel 1h
  server-template srv 10 novartc-server:9688 check resolvers docker init-addr libc,none resolve-prefer ipv4
