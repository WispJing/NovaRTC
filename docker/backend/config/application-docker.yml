server:
  port: 7000
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  application:
    name: NovaRTC
  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX
    serialization:
      write-dates-as-timestamps: false
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: redis
      database: 0
      port: 6379
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 2000ms
    mongodb:
      uri: mongodb://mongodb:27017/novartc
  datasource:
    url: jdbc:mysql://mysql:3306/novartc?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      min-idle: 10
      max-active: 50
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      max-evictable-idle-time-millis: 580000
      validation-query: SELECT 1
      test-on-borrow: false
      test-on-return: false
      test-while-idle: true
      pool-prepared-statements: false
      keep-alive: true
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        allow: 127.0.0.1,172.19.0.1
        login-username: admin
        login-password: admin123
        reset-enable: false
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      filter:
        stat:
          enabled: true
          slow-sql-millis: 2000
          log-slow-sql: true
        wall:
          enabled: true
          config:
            delete-allow: true
            update-allow: true
        slf4j:
          enabled: true
          statement-executable-sql-log-enable: true
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    encoding: UTF-8
    baseline-on-migrate: false
    locations: >
      classpath:db/migration,
      classpath:db/migration-dev
    table: flyway_schema_history
    validate-on-migrate: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

rocketmq:
  enabled: true
  name-server: namesrv:9876
  producer:
    group: im-chat-producer-group

im:
  host: 0.0.0.0
  port: 9688
  chatTopic: 'im-chat-topic'
  chatConsumerGroup: 'im-chat-consumer-group'
  presenceTopic: 'im-presence-topic'
  presenceConsumerGroup: 'im-presence-consumer-group'
  tokenKickTopic: 'im-token-kick-topic'
  tokenKickConsumerGroup: 'im-token-kick-consumer-group'
  userInstancesKeyPreFix: 'im:user:instances:'
  instanceKeyPreFix: 'im:user:instance:'
  chatSeqKeyPreFix: 'im:chatseq:'
  userFriendCacheKeyPreFix: 'im:relation:user:friends:'
  userGroupCacheKeyPreFix: 'im:relation:user:groups:'
  groupMembersCacheKeyPreFix: 'im:relation:group:members:'
  workerId: 1
  datacenterId: 1

logging:
  level:
    root: INFO
    io.github.xiaotang: INFO
    io.github.xiaotang.novartc.server.mapper: DEBUG
    com.baomidou.mybatisplus: DEBUG
    org.apache.ibatis: DEBUG
    io.netty: INFO

