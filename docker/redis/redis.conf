# 网络配置
bind 0.0.0.0
protected-mode yes
port 6379

# 通用配置
daemonize no                    # 必须为 no，否则与 docker 后台运行冲突 [citation:3]
pidfile /var/run/redis_6379.pid
loglevel notice

# 持久化配置 (AOF + RDB 混合)
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
dir /data

# 安全配置：设置密码 (强烈建议修改!)
requirepass your_strong_password_here

# 性能与限制
maxmemory 256mb
maxmemory-policy volatile-lru