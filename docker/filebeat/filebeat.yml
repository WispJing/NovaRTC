filebeat.inputs:

  # ================= 主系统日志 =================
  - type: filestream
    id: nova_app_server_1
    paths:
      - /data/logs/server-1/app*.log
    parsers:
      - ndjson:
          overwrite_keys: true
    fields:
      log_type: nova_app
      instance: server-1
    fields_under_root: true
    scan_frequency: 1s

  - type: filestream
    id: nova_app_server_2
    paths:
      - /data/logs/server-2/app*.log
    parsers:
      - ndjson:
          overwrite_keys: true
    fields:
      log_type: nova_app
      instance: server-2
    fields_under_root: true
    scan_frequency: 1s

  # ================= 主错误日志 =================
  - type: filestream
    id: nova_error_server_1
    paths:
      - /data/logs/server-1/error*.log
    parsers:
      - ndjson:
          overwrite_keys: true
    fields:
      log_type: nova_error
      instance: server-1
    fields_under_root: true
    scan_frequency: 1s

  - type: filestream
    id: nova_error_server_2
    paths:
      - /data/logs/server-2/error*.log
    parsers:
      - ndjson:
          overwrite_keys: true
    fields:
      log_type: nova_error
      instance: server-2
    fields_under_root: true
    scan_frequency: 1s

  # ================= IM 应用日志 =================
  - type: filestream
    id: im_app_server_1
    paths:
      - /data/logs/server-1/IM/app*.log
    parsers:
      - ndjson:
          overwrite_keys: true
    fields:
      log_type: im_app
      instance: server-1
    fields_under_root: true
    scan_frequency: 1s

  - type: filestream
    id: im_app_server_2
    paths:
      - /data/logs/server-2/IM/app*.log
    parsers:
      - ndjson:
          overwrite_keys: true
    fields:
      log_type: im_app
      instance: server-2
    fields_under_root: true
    scan_frequency: 1s

  # ================= IM 访问日志 =================
  - type: filestream
    id: im_access_server_1
    paths:
      - /data/logs/server-1/IM/access*.log
    parsers:
      - ndjson:
          overwrite_keys: true
    fields:
      log_type: im_access
      instance: server-1
    fields_under_root: true
    scan_frequency: 1s

  - type: filestream
    id: im_access_server_2
    paths:
      - /data/logs/server-2/IM/access*.log
    parsers:
      - ndjson:
          overwrite_keys: true
    fields:
      log_type: im_access
      instance: server-2
    fields_under_root: true
    scan_frequency: 1s

  # ================= IM 消息日志 =================
  - type: filestream
    id: im_msg_server_1
    paths:
      - /data/logs/server-1/IM/msg*.log
    parsers:
      - ndjson:
          overwrite_keys: true
    fields:
      log_type: im_msg
      instance: server-1
    fields_under_root: true
    scan_frequency: 1s

  - type: filestream
    id: im_msg_server_2
    paths:
      - /data/logs/server-2/IM/msg*.log
    parsers:
      - ndjson:
          overwrite_keys: true
    fields:
      log_type: im_msg
      instance: server-2
    fields_under_root: true
    scan_frequency: 1s

  # ================= IM 错误日志 =================
  - type: filestream
    id: im_error_server_1
    paths:
      - /data/logs/server-1/IM/error*.log
    parsers:
      - ndjson:
          overwrite_keys: true
    fields:
      log_type: im_error
      instance: server-1
    fields_under_root: true
    scan_frequency: 1s

  - type: filestream
    id: im_error_server_2
    paths:
      - /data/logs/server-2/IM/error*.log
    parsers:
      - ndjson:
          overwrite_keys: true
    fields:
      log_type: im_error
      instance: server-2
    fields_under_root: true
    scan_frequency: 1s

queue.mem:
  events: 8192
  flush.min_events: 1
  flush.timeout: 1s

output.elasticsearch:
  hosts: [ "http://elasticsearch:9200" ]
  worker: 2
  bulk_max_size: 10
  indices:
    - index: "nova-app-%{+yyyy.MM.dd}"
      when.equals:
        log_type: nova_app

    - index: "nova-error-%{+yyyy.MM.dd}"
      when.equals:
        log_type: nova_error

    - index: "im-app-%{+yyyy.MM.dd}"
      when.equals:
        log_type: im_app

    - index: "im-access-%{+yyyy.MM.dd}"
      when.equals:
        log_type: im_access

    - index: "im-msg-%{+yyyy.MM.dd}"
      when.equals:
        log_type: im_msg

    - index: "im-error-%{+yyyy.MM.dd}"
      when.equals:
        log_type: im_error

setup.template.enabled: true
setup.template.name: "im-logs"
setup.template.pattern: "*-*-*"

logging.level: info
