filebeat.inputs:

  # ================= 主系统日志 =================
  - type: filestream
    id: nova_app
    paths:
      - /data/logs/app*.log
    parsers:
      - ndjson:
          overwrite_keys: true
    fields:
      log_type: nova_app
    fields_under_root: true
    scan_frequency: 1s

  # ================= 主错误日志 =================
  - type: filestream
    id: nova_error
    paths:
      - /data/logs/error*.log
    parsers:
      - ndjson:
          overwrite_keys: true
    fields:
      log_type: nova_error
    fields_under_root: true
    scan_frequency: 1s

  # ================= IM 应用日志 =================
  - type: filestream
    id: im_app
    paths:
      - /data/logs/IM/app*.log
    parsers:
      - ndjson:
          overwrite_keys: true
    fields:
      log_type: im_app
    fields_under_root: true
    scan_frequency: 1s

  # ================= IM 访问日志 =================
  - type: filestream
    id: im_access
    paths:
      - /data/logs/IM/access*.log
    parsers:
      - ndjson:
          overwrite_keys: true
    fields:
      log_type: im_access
    fields_under_root: true
    scan_frequency: 1s

  # ================= IM 消息日志 =================
  - type: filestream
    id: im_msg
    paths:
      - /data/logs/IM/msg*.log
    parsers:
      - ndjson:
          overwrite_keys: true
    fields:
      log_type: im_msg
    fields_under_root: true
    scan_frequency: 1s

  # ================= IM 错误日志 =================
  - type: filestream
    id: im_error
    paths:
      - /data/logs/IM/error*.log
    parsers:
      - ndjson:
          overwrite_keys: true
    fields:
      log_type: im_error
    fields_under_root: true
    scan_frequency: 1s

queue.mem:
  events: 8192
  flush.min_events: 1
  flush.timeout: 1s

# ================= 输出到 ES =================
output.elasticsearch:
  hosts: [ "http://elasticsearch:9200" ]
  worker: 2
  bulk_max_size: 10
  indices:
    - index: "nova-app-%{+yyyy.MM.dd}"
      when.equals:
        log_type: nova_app

    - index: "nova-error-%{+yyyy.MM.dd}"
      when.equals:
        log_type: nova_error

    - index: "im-app-%{+yyyy.MM.dd}"
      when.equals:
        log_type: im_app

    - index: "im-access-%{+yyyy.MM.dd}"
      when.equals:
        log_type: im_access

    - index: "im-msg-%{+yyyy.MM.dd}"
      when.equals:
        log_type: im_msg

    - index: "im-error-%{+yyyy.MM.dd}"
      when.equals:
        log_type: im_error

setup.template.enabled: true
setup.template.name: "im-logs"
setup.template.pattern: "*-*-*"

logging.level: info
