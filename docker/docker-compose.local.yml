name: novartc-local

networks:
  novartc-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/24
          gateway: 172.19.0.1

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: novartc-elasticsearch
    ports:
      - "9200:9200"
    networks:
      - novartc-net
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      TZ: UTC
    volumes:
      - ./elasticsearch/data:/usr/share/elasticsearch/data
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: novartc-kibana
    ports:
      - "5601:5601"
    networks:
      - novartc-net
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.4
    container_name: novartc-filebeat
    user: root
    command: ["--strict.perms=false"]
    networks:
      - novartc-net
    volumes:
      - ./filebeat/filebeat-docker.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - elasticsearch
      - novartc-server
    restart: unless-stopped

  mysql:
    build:
      context: ./mysql
      dockerfile: Dockerfile
    container_name: novartc-mysql
    ports:
      - "3307:3306"
    networks:
      - novartc-net
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: novartc
      TZ: UTC
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/conf/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./mysql/logs:/var/log/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8.4.0
    container_name: novartc-redis
    ports:
      - "6379:6379"
    networks:
      - novartc-net
    volumes:
      - ./redis/data:/data
      - ./redis/conf/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped

  mongodb:
    image: mongo:8.2.5
    container_name: novartc-mongodb
    ports:
      - "27017:27017"
    networks:
      - novartc-net
    volumes:
      - ./mongodb/data:/data/db
      - ./mongodb/config:/data/configdb
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

  namesrv:
    image: apache/rocketmq:4.9.6
    container_name: novartc-rmqnamesrv
    ports:
      - "9876:9876"
    networks:
      - novartc-net
    command: sh mqnamesrv
    restart: unless-stopped

  broker:
    image: apache/rocketmq:4.9.6
    container_name: novartc-rmqbroker
    ports:
      - "10909:10909"
      - "10911:10911"
    networks:
      - novartc-net
    environment:
      NAMESRV_ADDR: namesrv:9876
      TZ: UTC
    depends_on:
      - namesrv
    volumes:
      - ./rocketmq/conf/broker-docker.conf:/home/rocketmq/rocketmq-4.9.6/conf/broker.conf:ro
      - ./rocketmq/logs:/home/rocketmq/logs
      - ./rocketmq/store:/home/rocketmq/store
    command: sh mqbroker -c /home/rocketmq/rocketmq-4.9.6/conf/broker.conf
    restart: unless-stopped

  dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: novartc-rmqdashboard
    ports:
      - "8082:8082"
    networks:
      - novartc-net
    environment:
      JAVA_OPTS: >
        -Drocketmq.namesrv.addr=namesrv:9876
        -Drocketmq.config.loginRequired=true
        -Xmx256M -Xms256M
    volumes:
      - ./dashboard/users.properties:/tmp/rocketmq-console/data/users.properties:ro
      - ./dashboard/logs:/tmp/rocketmq-console/logs
      - ./dashboard/data:/tmp/rocketmq-console/data
    depends_on:
      - namesrv
    restart: unless-stopped

  haproxy:
    image: haproxy:2.9
    container_name: novartc-haproxy
    ports:
      - "7000:7000"
      - "9688:9688"
    networks:
      - novartc-net
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - novartc-server
    restart: unless-stopped

  novartc-server:
    image: eclipse-temurin:21-jre
    working_dir: /opt/novartc
    networks:
      - novartc-net
    environment:
      TZ: UTC
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: -Xms512m -Xmx1024m
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-novartc-local}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      mongodb:
        condition: service_started
      namesrv:
        condition: service_started
      broker:
        condition: service_started
    volumes:
      - ../novartc-server/target/novartc-server-1.0.0-SNAPSHOT.jar:/opt/novartc/app.jar:ro
      - ./backend/config:/opt/novartc/config:ro
      - ./backend/start-server.sh:/opt/novartc/start-server.sh:ro
    command: >
      sh /opt/novartc/start-server.sh
    restart: unless-stopped


