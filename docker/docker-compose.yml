version: '3.8'

name: novartc

networks:
  novartc-net:
    driver: bridge

services:
  # ES
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: elasticsearch
    networks:
      - novartc-net
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - TZ=UTC
    ports:
      - "9200:9200"
    volumes:
      - ./elasticsearch/data:/usr/share/elasticsearch/data
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: kibana
    ports:
      - "5601:5601"
    networks:
      - novartc-net
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.4
    container_name: filebeat
    user: root
    command: [ "--strict.perms=false" ]
    networks:
      - novartc-net
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml
      - ../logs:/data/logs
    depends_on:
      - elasticsearch

  mysql:
    image: im-mysql:8.0          # 使用 MySQL 8.0 最新版本，也可指定具体版本如 mysql:8.0.36
    container_name: mysql
    ports:
      - "3307:3306"           # 映射主机 3306 端口，如主机已占用可改为其他端口（例如 3307:3306）
    networks:
      - novartc-net
    environment:
      MYSQL_ROOT_PASSWORD: 123456     # 请修改为强密码
      TZ: UTC                # 时区设置
    volumes:
      - ./mysql/data:/var/lib/mysql                # 数据持久化目录
      # - ./mysql/conf/my.cnf:/etc/mysql/conf.d/my.cnf:ro   # 挂载自定义配置文件（只读）
      - ./mysql/logs:/var/log/mysql
    restart: unless-stopped
    # 可选健康检查（需要正确传入密码，可省略）
    # healthcheck:
    #   test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 30s

  # Redis 8.4.0
  redis:
    image: redis:8.4.0
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - novartc-net
    volumes:
      # 挂载数据目录以实现数据持久化
      - "./redis/data:/data"
      # 挂载自定义配置文件 (只读模式)
      - "./redis/conf/redis.conf:/usr/local/etc/redis/redis.conf:ro"
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped
    # 健康检查，确保服务正常
#    healthcheck:
#      test: [ "CMD", "redis-cli", "-a", "your_strong_password_here", "ping" ]
#      interval: 10s
#      timeout: 5s
#      retries: 3
#      start_period: 30s

  # MongoDB 8.2.5 服务
  mongodb:
    image: mongo:8.2.5
    container_name: mongodb
    ports:
      - "27017:27017"
    networks:
      - novartc-net
#    environment:
      # 可选：初始化管理员账号（如开启认证）
#      MONGO_INITDB_ROOT_USERNAME: root          # 请修改为自定义用户名
#      MONGO_INITDB_ROOT_PASSWORD: abc123       # 请修改为强密码
      # 可选：初始化一个普通数据库和用户（如需自动创建）
      # MONGO_INITDB_DATABASE: mydb
    volumes:
      - ./mongodb/data:/data/db                    # 主数据目录
      - ./mongodb/config:/data/configdb             # 配置数据目录（分片集群用，单实例也可留）
      # 可选：挂载初始化脚本（自动创建用户/集合）
      # - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

  # RocketMQ 4.9.6
  namesrv:
    image: apache/rocketmq:4.9.6
    container_name: rmqnamesrv
    ports:
      - "9876:9876"
    networks:
      - novartc-net
    command: sh mqnamesrv
  broker:
    image: apache/rocketmq:4.9.6
    container_name: rmqbroker
    ports:
      - "10909:10909"
      - "10911:10911"
    networks:
      - novartc-net
    environment:
      - NAMESRV_ADDR=namesrv:9876
      - TZ=UTC
    depends_on:
      - namesrv
    volumes:
      - ./rocketmq/conf/broker.conf:/home/rocketmq/rocketmq-4.9.6/conf/broker.conf:ro
      - ./rocketmq/logs:/home/rocketmq/logs
      - ./rocketmq/store:/home/rocketmq/store
    command: sh mqbroker -c /home/rocketmq/rocketmq-4.9.6/conf/broker.conf

  # RocketMQ Dashboard（管理控制台）
  dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: rocketmq-dashboard
    ports:
      - "8082:8082"  # 浏览器访问端口
    networks:
      - novartc-net
    environment:
      # 关键配置：指定 NameServer 地址（使用服务名 namesrv）
      JAVA_OPTS: >
        -Drocketmq.namesrv.addr=namesrv:9876
        -Drocketmq.config.loginRequired=true
        -Xmx256M -Xms256M
    volumes:
      - ./dashboard/users.properties:/tmp/rocketmq-console/data/users.properties:ro  # 挂载用户文件
      - ./dashboard/logs:/tmp/rocketmq-console/logs
      - ./dashboard/data:/tmp/rocketmq-console/data
    depends_on:
      - namesrv
    restart: unless-stopped

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "6000:9000"    # S3 API，宿主机使用 6000
      - "6001:9001"    # 管理控制台，宿主机使用 6001
    networks:
      - novartc-net
    environment:
      - MINIO_ROOT_USER=novartc
      - MINIO_ROOT_PASSWORD=novartc123456
      - TZ=UTC
    volumes:
      - ./minio/data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  dashboard-logs:
  dashboard-data:
