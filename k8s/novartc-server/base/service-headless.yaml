apiVersion: v1
kind: Service
metadata:
  name: novartc-server-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: novartc-server
  ports:
    - name: http
      port: 7000
      targetPort: http
      protocol: TCP
    - name: im
      port: 9688
      targetPort: im
      protocol: TCP
